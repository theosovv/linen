name: Дефект
description: Воспроизводимое нарушение спецификации или инфраструктурный сбой.
title: "[Bug] "
body:
  - type: textarea
    id: symptom
    attributes:
      label: Симптом
      description: Что произошло и почему это дефект?
    validations:
      required: true

  - type: input
    id: specification
    attributes:
      label: Пункт SPEC.md или ADR
      placeholder: "§6.2 — стабильный diagnostic code"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Минимальный reproducer
      description: Команды, исходный .ln или минимальный Rust-тест. Не прикладывайте секреты.
      value: |
        # Команда

        # Входные данные

        # Фактический результат

        # Ожидаемый результат
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: OS, rustc --version, commit и релевантная конфигурация.
    validations:
      required: true

  - type: checkboxes
    id: regression
    attributes:
      label: Regression
      options:
        - label: Reproducer минимизирован и может быть сохранён как regression test.
          required: true
